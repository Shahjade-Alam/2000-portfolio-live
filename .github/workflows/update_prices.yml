name: Update Portfolio Data

on:
  schedule:
    # Runs at 21:00 UTC every weekday (after US market close)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:  # manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install yfinance pandas

      - name: Fetch Prices
        run: python scripts/fetch_prices.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update portfolio data [skip ci]" && git push)
