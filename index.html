  <style>
    *,
    *::before,

    }
    :root {
      --bg: #0a0c12;
      --surface: #12151e;
      --card: #1a1e2e;
      --border: #1e2332;
      --border-light: #232838;
      --text: #f0f4ff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-violet: #8b5cf6;
      --accent-blue: #38bdf8;

      --grad-violet: linear-gradient(135deg, #8b5cf6, #6366f1);

      --grad-amber: linear-gradient(135deg, #fbbf24, #f59e0b);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 12px var(--accent-emerald);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }
    .flash-up {
      animation: flashUp 0.9s ease-out;
    }
    .flash-down {
      animation: flashDown 0.9s ease-out;
    }
    @keyframes flashUp {
      0% {
        background: rgba(52, 211, 153, 0.25);
      }
      100% {
        background: transparent;
      }
    }
    @keyframes flashDown {
      0% {
        background: rgba(248, 113, 113, 0.25);
      }
      100% {
        background: transparent;
      }
    }
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-light);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>

    async function fetchPrices() {
      try {
        const resp = await fetch(API_URL, { cache: 'no-store' });
        if (!resp.ok) throw new Error('API failed');
        const data = await resp.json();
        const result = data?.quoteResponse?.result;
        if (!Array.isArray(result)) throw new Error('No result');
        const prices = {};
        for (const item of result) {
          const ticker = item.symbol?.toUpperCase();
          if (!ticker) continue;
          const price = item.regularMarketPrice;
          if (price == null) continue;
          const change = item.regularMarketChange ?? 0;
          const changePct = item.regularMarketChangePercent ?? 0;
          prices[ticker] = { price, change, changePct };
        }
        if (Object.keys(prices).length === 0) throw new Error('Empty prices');
        return prices;
      } catch (err) {
        console.warn('Fetch failed, using fallback/cached', err);
        return null;
      }
    }

    function getCachedPrices() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (raw) {
          const cached = JSON.parse(raw);
          if (cached && typeof cached === 'object') return cached;
        }
      } catch {}
      return null;
    }

    function setCachedPrices(prices) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(prices));
      } catch {}
    }

    // ----- React App -----
    const App = () => {
      const [filter, setFilter] = useState('');
      const [prices, setPrices] = useState(() => {
        const cached = getCachedPrices();
        if (cached) return cached;
        return FALLBACK_PRICES;
      });
      const [status, setStatus] = useState('cached');
      const [lastUpdate, setLastUpdate] = useState(null);
      const [countdown, setCountdown] = useState(300);
      const [flashes, setFlashes] = useState({});
      const intervalRef = useRef(null);
      const countdownRef = useRef(null);

      // Load from cache on mount
      useEffect(() => {
        const cached = getCachedPrices();
        if (cached) {
          setPrices(cached);
          setStatus('cached');
          setLastUpdate(new Date());
        }
        // Attempt immediate fetch
        refreshPrices();
      }, []);

      // Countdown timer
      useEffect(() => {
        countdownRef.current = setInterval(() => {
          setCountdown(prev => {
            if (prev <= 1) {
              refreshPrices();
              return 300;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(countdownRef.current);
      }, []);

      const refreshPrices = async () => {
        setStatus('updating');
        const newPrices = await fetchPrices();
        if (newPrices) {
          // Compare for flashes
          const flashesObj = {};
          for (const ticker of Object.keys(newPrices)) {
            const old = prices[ticker];
            if (old && old.price !== newPrices[ticker].price) {
              flashesObj[ticker] = newPrices[ticker].price > old.price ? 'up' : 'down';
            }
          }
          setFlashes(flashesObj);
          setTimeout(() => setFlashes({}), 900);

          setPrices(prev => ({ ...prev, ...newPrices }));
          setCachedPrices({ ...prices, ...newPrices });
          setStatus('live');
          setLastUpdate(new Date());
          setCountdown(300);
        } else {
          // If fetch fails but we have cached, keep cached
          const cached = getCachedPrices();
          if (cached) {
            setPrices(cached);
            setStatus('cached');
          } else {
            setStatus('fallback');
          }

      const filteredHoldings = useMemo(() => {
        const q = filter.toLowerCase().trim();

          h.name.toLowerCase().includes(q) ||
          h.detail.toLowerCase().includes(q)

        risk: { label: 'Risk', icon: '🚀', color: 'fuchsia', avgExp: '0.35%' },
      };

      // Expense badge helper
      const getExpenseStyle = (exp) => {
        if (exp == null) return 'bg-[#171c2a] border-[#242c41] text-zinc-500';
        if (exp <= 0.25) return 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30';
        if (exp <= 0.65) return 'bg-amber-500/15 text-amber-300 border-amber-500/30';

      // Sector quadrant styles
      const quadrantColors = {

        'Neutral': { bg: 'bg-[#422006]', border: 'border-[#854d0e]', text: 'text-amber-300', badge: 'bg-amber-500/20 border-amber-500/40 text-amber-300' },

      // Group sectors by quadrant
      const quadrantGroups = SECTORS.reduce((acc, s) => {

        acc[q].push(s);
        return acc;

            <div className="max-w-[1280px] mx-auto px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-3 min-w-0">
                <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center text-[14px] shrink-0">
                  💼
                </div>
                <div className="min-w-0">
                  <h1 className="font-extrabold tracking-tight text-[12px] sm:text-[13px] uppercase leading-tight">
                    $2,000/mo FINAL
                    <span className="hidden lg:inline font-medium text-zinc-400 normal-case ml-2 text-[11px]">
                      Stocks $435 + LT $565 + Income $500 + Risk $500 • 24 holdings
                    </span>
                  </h1>
                  <p className="lg:hidden text-[10px] text-zinc-400 mt-0.5 leading-none">
                    24 holdings • $2K/mo • Yahoo v7 batch • 5min refresh
                  </p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <div className="flex items-center gap-2 rounded-full bg-[#12151e] border border-[#232838] px-2.5 py-1">
                  <span className="relative flex h-2 w-2">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className={`relative inline-flex rounded-full h-2 w-2 ${
                      status === 'live' ? 'bg-emerald-400' : status === 'updating' ? 'bg-amber-400' : 'bg-zinc-500'

                  </span>
                  <span className={`text-[10px] font-bold tracking-wide mono ${

                  </span>
                </div>
                <div className="hidden sm:flex h-[28px] px-3 rounded-full bg-[#12151e] border border-[#232838] items-center gap-2 text-[10px] mono text-zinc-400">

                >
                  🔄 REFRESH
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-[1280px] mx-auto px-3 sm:px-5 py-3">
            {/* ---- Stats Cards ---- */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-2 mb-3">

                            <div className={`h-full ${s.badge === 'Weakening' || s.badge === 'Extended' ? 'bg-red-500' : s.badge === 'Neutral' ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.max(10, Math.min(100, (s.ytd + 5) / 25 * 100))}%` }}></div>
                          </div>
                          <span className="mono text-[9px] text-zinc-500">YTD {s.ytd}%</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </section>

            {/* ---- Footer ---- */}
            <footer className="mt-4 text-center text-[9px] text-zinc-600 tracking-wide leading-relaxed">
              ⚡ batch v7/quote 24 tickers in 1 call • 3‑way race • ONE DOM update • cache localStorage • RRG 4 quadrants • 13 sectors • Financials +4.2% to +4.5% leadership shift • © 2025
            </footer>
          </main>
        </div>
      );
    };

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
